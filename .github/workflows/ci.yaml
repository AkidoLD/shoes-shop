name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    
jobs:
  lint:
    uses: ./.github/workflows/lint_test.yaml
    
  test:
    uses: ./.github/workflows/unit_test.yaml
    
  ci:
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "${{toJson(needs)}}"q
      - run: echo "CI validé !"
