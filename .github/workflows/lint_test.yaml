name: Lint Tests

on:
  workflow_call:
  push:
    # branches-ignore: [main]
  pull_request:
    branches: [main]
    
jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - run: composer install --dev
      - run: composer run php-cs-fixer -- fix --dry-run --diff
