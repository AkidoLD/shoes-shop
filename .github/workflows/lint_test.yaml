name: Lint Tests

on:
  workflow_call:
  
jobs:
  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_sqlite
      - run: composer install --dev
      - run: composer run php-cs-fixer -- fix --dry-run --diff
