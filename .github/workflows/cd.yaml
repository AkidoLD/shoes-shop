name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
  build:
    needs: ci
    uses: ./.github/workflows/build.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: [ci, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
      - run: unzip release.zip
      - run: ls -R
      - run: echo "Deploiement reussi"
