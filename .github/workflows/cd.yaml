name: CD

on: 
  push:
    tags: ["v*"]
  workflow_dispatch:
    
jobs:
  build:
    uses: ./.github/workflows/build.yaml

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - uses: actions/download-artifact@v4
        with:
          name: app-release
      - run: unzip release.zip
      - run: ls -R
      - run: echo "Deploiement reussi"
    
