name : Continious Delivery

on:
  push: 
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: ci
    uses: ./.github/workflows/build.yaml
  
  create-app-release:
    name: Create ${{github.ref_name}} app release
    runs-on: ubuntu-latest      
    needs: [ci, build]
    
    permissions: 
      contents: write
    env:
      VERSION : ${{github.ref_name}}
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      
    steps:
      - name: Get the app build ...
        uses: actions/download-artifact@v7
        with:
          name: app-build
      - run: echo "build retrieve successfully"
      - run: mv build.zip app-$VERSION.zip
      - name: Creation of the release ...
        run: gh release create "$VERSION" "app-$VERSION.zip" --generate-notes
