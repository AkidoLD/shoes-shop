name: Unit Tests

on: 
  workflow_call:
    
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - run: pwd
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_sqlite
      - run: composer install --dev
      - run: composer run test
