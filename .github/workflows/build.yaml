name: Build

on: workflow_call

jobs:
  create-linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-php
      - name: Archivage du code ...
        run: zip -r build.zip . -x ".git*" ".github/*" "tests/*" "docs/*" "phpunit.xml" ".php-cs-fixer.dist.php"
      - run: echo "Code archive"
      - name: "Televersement du build ..."
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: build.zip
          retention-days: 3
      - run: echo "Build televerse."
