name: Build

on: workflow_call

jobs:
  create-linux-artefact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_sqlite
      - run: composer install --no-dev --optimize-autoloader --no-interaction
      - name: Archivage du code ...
        run: zip -r release.zip . -x ".git*" ".github/*" "tests/*" "docs/*" "phpunit.xml" ".php-cs-fixer.dist.php"
      - run: echo "Code archive"
      - name: "Publication de l'artefacte"
        uses: actions/upload-artifact@v4
        with:   
           name: app-release
           path: release.zip
      - run: echo "Artefact publie"
